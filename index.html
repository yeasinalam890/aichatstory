<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daryeam AI - Interactive Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white font-sans antialiased flex flex-col h-screen overflow-hidden">

    <!-- Top Navigation / Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">Daryeam AI</h1>
        <div class="flex items-center space-x-3">
            <button onclick="openAdminLogin()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full border border-gray-700 transition">Admin</button>
            <button onclick="openSettings()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full border border-gray-700 transition">Settings</button>
        </div>
    </header>

    <!-- Main Content App Body -->
    <main id="app-container" class="flex-1 overflow-y-auto p-4 pb-20">
        <!-- Home View / Story List -->
        <div id="home-view" class="space-y-4">
            <div class="bg-gradient-to-r from-purple-900/40 to-pink-900/40 border border-purple-800/50 p-4 rounded-2xl">
                <h2 class="text-lg font-bold mb-1">Campus Ke Dil Ki Dhadkan ❤️🎓</h2>
                <p class="text-xs text-gray-300 mb-3">College mein do alag duniya ke students ki pyaar bhari kahani shuru hoti hai.</p>
                <button onclick="startStory('default')" class="bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg">START CHAT</button>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="hidden flex flex-col h-full">
            <div class="flex items-center justify-between pb-3 border-b border-gray-800 mb-3">
                <button onclick="goHome()" class="text-sm text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
                <span id="chat-title" class="text-sm font-semibold truncate max-w-[180px]">Story Chat</span>
                <div class="flex space-x-2">
                    <button onclick="saveLocalChat()" class="text-xs bg-purple-900/60 border border-purple-700 px-2.5 py-1 rounded-lg text-purple-200">Save</button>
                    <button onclick="undoLast()" class="text-xs bg-gray-800 px-2.5 py-1 rounded-lg text-gray-300">Undo</button>
                </div>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm pb-4">
                <!-- Messages populated dynamically -->
            </div>
            <div class="pt-2 flex items-center space-x-2 bg-gray-950">
                <input type="text" id="user-input" placeholder="Type response..." class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500">
                <button onclick="sendMessage()" class="bg-gradient-to-r from-pink-600 to-purple-600 px-4 py-2.5 rounded-xl text-sm font-semibold"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-2xl p-5 space-y-4">
            <h3 class="text-lg font-bold">Admin Login</h3>
            <input type="text" id="admin-user" placeholder="Username" autocomplete="off" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
            <input type="password" id="admin-pass" placeholder="Password" autocomplete="new-password" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeAdminLogin()" class="px-4 py-2 text-xs text-gray-400">Cancel</button>
                <button onclick="submitAdminLogin()" class="px-4 py-2 text-xs bg-purple-600 rounded-xl font-semibold">Login</button>
            </div>
        </div>
    </div>

    <!-- Edit Story / Settings Modal with Pre-Scene Chats -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-blackv80 bg-black/80 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-5 space-y-3 my-auto">
            <h3 class="text-lg font-bold">Edit Story & Pre-Scene Chats</h3>
            <div>
                <label class="text-xs text-gray-400">Story Title</label>
                <input type="text" id="edit-title" value="Campus Ke Dil Ki Dhadkan" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
                <label class="text-xs text-gray-400">Character Traits</label>
                <input type="text" id="edit-traits" value="Feisty, caring, confident" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
                <label class="text-xs text-gray-400">Pre-Scene Chats (3-4 Opening Dialogues, separated by line breaks)</label>
                <textarea id="edit-prescene" rows="4" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm" placeholder="Line 1: *Scene setup...*&#10;Line 2: Aisha: Hello..."></textarea>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeSettings()" class="px-4 py-2 text-xs text-gray-400">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-xs bg-purple-600 rounded-xl font-semibold">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav Bar -->
    <nav class="bg-gray-900 border-t border-gray-800 h-16 flex justify-around items-center absolute bottom-0 w-full z-10">
        <button onclick="goHome()" class="flex flex-col items-center text-purple-400 text-xs"><i class="fa-solid fa-house text-base"><span>Home</span></i></button>
    </nav>

    <script>
        let currentHistory = [];
        let storyConfig = {
            title: "Campus Ke Dil Ki Dhadkan",
            traits: "Feisty, caring, confident",
            preScene: [
                "*Che mahine beet gaye, Aisha... tum sach mein aa gaye!*",
                "Aisha: \"Main bhi mujhe kal dusri jagah jaana lekin main proof kr ke rahunga.\""
            ]
        };

        function openAdminLogin() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminLogin() { document.getElementById('admin-modal').classList.add('hidden'); }
        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

        function submitAdminLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            if(user && pass) {
                alert("Admin logged in successfully!");
                closeAdminLogin();
            } else {
                alert("Please fill in fields.");
            }
        }

        function saveSettings() {
            storyConfig.title = document.getElementById('edit-title').value;
            storyConfig.traits = document.getElementById('edit-traits').value;
            const rawPre = document.getElementById('edit-prescene').value;
            if(rawPre.trim()) {
                storyConfig.preScene = rawPre.split('\n').filter(Boolean);
            }
            alert("Story settings updated!");
            closeSettings();
        }

        function goHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('chat-view').classList.add('hidden');
        }

        function startStory(id) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('chat-title').innerText = storyConfig.title;
            
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            currentHistory = [];

            // Load pre-scene chats defined by admin
            storyConfig.preScene.forEach(text => {
                currentHistory.push({ sender: 'assistant', text });
                appendMessageBubble('assistant', text);
            });
        }

        function appendMessageBubble(sender, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-2`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] px-4 py-2.5 rounded-2xl text-sm ${sender === 'user' ? 'bg-gradient-to-r from-pink-600 to-purple-600 text-white rounded-br-none' : 'bg-gray-900 border border-gray-800 text-gray-200 rounded-bl-none'}`;
            bubble.innerText = text;
            
            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if(!message) return;

            appendMessageBubble('user', message);
            currentHistory.push({ sender: 'user', text: message });
            input.value = '';

            // Query backend server API route
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        storyId: 'default',
                        message: message,
                        history: currentHistory,
                        storyDetails: { name: "Aisha", traits: storyConfig.traits.split(',') }
                    })
                });
                const data = await response.json();
                if(data.reply) {
                    appendMessageBubble('assistant', data.reply);
                    currentHistory.push({ sender: 'assistant', text: data.reply });
                }
            } catch(e) {
                console.error(e);
                appendMessageBubble('assistant', "*Aisha looks away quietly.* (Network error)");
            }
        }

        function saveLocalChat() {
            localStorage.setItem('daryeam_saved_chat', JSON.stringify(currentHistory));
            alert("Chat saved locally to your browser device! It will clear when you clear browser cache.");
        }

        function undoLast() {
            if(currentHistory.length > 0) {
                currentHistory.pop();
                const container = document.getElementById('chat-messages');
                if(container.lastChild) container.removeChild(container.lastChild);
            }
        }
    </script>
</body>
</html>
