<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roleplay AI - Interactive Story Hub</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --panel-bg: #131a2a;
            --card-bg: #182238;
            --accent-purple: #9333ea;
            --accent-pink: #db2777;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --ai-bubble: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        body { display: flex; justify-content: center; }

        .app-shell {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            position: relative;
        }

        .top-navbar {
            padding: 12px 16px;
            background: rgba(13, 19, 34, 0.98);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-navbar h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(to right, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-btn {
            background: #1e293b;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        .screen-container { flex: 1; overflow-y: auto; padding: 14px; }

        .hero-banner {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
        }

        .hero-banner img { width: 100%; height: 100%; object-fit: cover; }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(9, 13, 22, 0.95), transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }

        .btn-start-chat {
            align-self: flex-start;
            padding: 6px 16px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .grid-poster-wrap { width: 100%; height: 150px; background: var(--panel-bg); }
        .grid-poster-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .grid-info { padding: 10px; }
        .grid-info h4 { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .grid-meta { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

        .chat-window-view {
            position: absolute;
            inset: 0;
            background: var(--bg-main);
            z-index: 50;
            display: none;
            flex-direction: column;
        }

        .chat-window-view.active { display: flex; }

        .chat-view-header {
            padding: 10px 14px;
            background: #131a2a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .chat-conversation-area {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.4;
            font-size: 0.88rem;
            white-space: pre-wrap;
        }

        .chat-msg.ai {
            background-color: var(--ai-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .chat-msg.user {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            color: white;
        }

        .chat-input-bar {
            padding: 10px 14px;
            background: #131a2a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: white;
            outline: none;
        }

        .chat-input-bar button {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="top-navbar">
            <h1>Roleplay AI</h1>
            <button class="header-btn">⚙ Settings</button>
        </div>

        <div class="screen-container">
            <div class="hero-banner" onclick="openStory(0)">
                <img id="heroImg" src="https://image.pollinations.ai/prompt/romantic%20indian%20college%20couple?width=400&height=550&nologo=true" alt="Hero">
                <div class="hero-overlay">
                    <h2 id="heroTitle">Campus Ke Dil Ki Dhadkan</h2>
                    <p style="font-size: 0.8rem; color: #94a3b8;">Romance • Hinglish</p>
                    <button class="btn-start-chat">START CHAT</button>
                </div>
            </div>

            <div class="section-title">Explore Stories</div>
            <div class="story-grid" id="homeStoryGrid"></div>
        </div>

        <!-- Chat View -->
        <div class="chat-window-view" id="chatWindow">
            <div class="chat-view-header">
                <button class="btn-back" onclick="closeChat()">← Back</button>
                <div>
                    <h3 id="chatTitle">Aisha</h3>
                    <p id="chatMeta" style="font-size: 0.65rem; color: #94a3b8;">Roleplay</p>
                </div>
            </div>

            <div class="chat-conversation-area" id="chatContainer"></div>

            <div class="chat-input-bar">
                <input type="text" id="userInput" placeholder="Type response..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button id="sendBtn" onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // MULTIPLE STORIES DATA
        const STORIES = [
            {
                id: 0,
                title: "Campus Ke Dil Ki Dhadkan",
                meta: "Romance • Hinglish",
                img: "https://image.pollinations.ai/prompt/romantic%20indian%20college%20couple?width=400&height=550&nologo=true",
                systemPrompt: "You are Aisha, an arrogant college girl speaking Hinglish. Respond in short roleplay format.",
                initialMsg: "*Library mein tumhare aage Aisha khadi hai aur tum se galti se takra gaye ho, jis wajah se uski mehangi kitabein neeche gir gayi.*\n\nAisha: \"Dikhta nahi hai kya? Gawaar kahin ke! Excuse me? Tumne meri books girayi aur ab mujhe hi dekh rahe ho?\""
            },
            {
                id: 1,
                title: "The Billionaire's Secret",
                meta: "Drama • English",
                img: "https://image.pollinations.ai/prompt/handsome%20billionaire%20in%20suit?width=400&height=550&nologo=true",
                systemPrompt: "You are Alexander, a cold billionaire CEO speaking English.",
                initialMsg: "*Alexander looks up from his desk, glaring at you coldly.*\n\nAlexander: \"You're 5 minutes late for the interview. Give me one good reason why I shouldn't fire you right now.\""
            },
            {
                id: 2,
                title: "Cyberpunk 2099",
                meta: "Sci-Fi • English",
                img: "https://image.pollinations.ai/prompt/cyberpunk%20warrior%20neon%20city?width=400&height=550&nologo=true",
                systemPrompt: "You are Vex, a rogue hacker in a dystopian neon city.",
                initialMsg: "*Vex pulls you into a dark alley away from the corporate drones.*\n\nVex: \"Keep your head down! Did you bring the encrypted drive or not?\""
            },
            {
                id: 3,
                title: "Mafia Revenge",
                meta: "Crime • Hinglish",
                img: "https://image.pollinations.ai/prompt/dark%20mafia%20boss%20portrait?width=400&height=550&nologo=true",
                systemPrompt: "You are Vikram, a dangerous underworld boss speaking Hinglish.",
                initialMsg: "*Vikram lights a cigarette and looks at you through the smoke.*\n\nVikram: \"Tumhe lagta hai tum mere ilake mein aakar mujhse hi shatranj kheloge?\""
            }
        ];

        let currentStory = null;
        let messagesArray = [];

        // Render Stories on load
        function loadStories() {
            const grid = document.getElementById('homeStoryGrid');
            grid.innerHTML = STORIES.map(s => `
                <div class="grid-card" onclick="openStory(${s.id})">
                    <div class="grid-poster-wrap">
                        <img src="${s.img}" alt="${s.title}">
                    </div>
                    <div class="grid-info">
                        <h4>${s.title}</h4>
                        <div class="grid-meta">${s.meta}</div>
                    </div>
                </div>
            `).join('');
        }

        function openStory(id) {
            currentStory = STORIES[id];
            document.getElementById('chatTitle').innerText = currentStory.title;
            document.getElementById('chatMeta').innerText = currentStory.meta;

            // Reset Chat Container
            const chatBox = document.getElementById('chatContainer');
            chatBox.innerHTML = `<div class="chat-msg ai">${currentStory.initialMsg.replace(/\n/g, '<br>')}</div>`;

            messagesArray = [
                { role: "system", content: currentStory.systemPrompt },
                { role: "assistant", content: currentStory.initialMsg }
            ];

            document.getElementById('chatWindow').classList.add('active');
        }

        function closeChat() {
            document.getElementById('chatWindow').classList.remove('active');
        }

        async function sendChatMessage() {
            const inputField = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const userMsg = inputField.value.trim();

            if (!userMsg) return;

            appendMessage(userMsg, 'user');
            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            messagesArray.push({ role: "user", content: userMsg });

            try {
                // Using POST API format to prevent URL length / CORS issues
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: messagesArray,
                        model: "openai"
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                appendMessage(aiReply, 'ai');
                messagesArray.push({ role: "assistant", content: aiReply });

            } catch (err) {
                console.error("Fetch Error:", err);
                appendMessage("*System Error: Failed to load response. Please try sending again.*", 'ai');
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        function appendMessage(text, type) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `chat-msg ${type}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Initialize grid on load
        loadStories();
    </script>
</body>
</html>
